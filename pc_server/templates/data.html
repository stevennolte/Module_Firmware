<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Module Data Log Viewer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
  <h1>📊 Module Data Log Viewer</h1>
  <div class="header-actions">
    <button class="btn btn-secondary" onclick="window.location.href='/charts'">📈 View Charts</button>
    <button class="btn btn-secondary" onclick="window.location.href='/'">← Back to Dashboard</button>
  </div>
</header>

<div class="controls">
  <div>
    <label for="moduleFilter">Filter by module:</label>
    <select id="moduleFilter" onchange="applyFilter()">
      <option value="">All modules</option>
    </select>
  </div>
  
  <div>
    <label for="limitSelect">Rows per page:</label>
    <select id="limitSelect" onchange="changeLimit()">
      <option value="50">50</option>
      <option value="100" selected>100</option>
      <option value="250">250</option>
      <option value="500">500</option>
    </select>
  </div>
  
  <button class="btn btn-primary" onclick="refreshData()">↻ Refresh</button>
</div>

<div class="data-container">
  <div class="stats" id="stats">Loading...</div>
  
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Module</th>
          <th>IP Address</th>
          <th>Version</th>
          <th>Debug Data</th>
        </tr>
      </thead>
      <tbody id="dataTable">
        <tr><td colspan="5" class="loading">Loading data...</td></tr>
      </tbody>
    </table>
  </div>
  
  <div class="pagination">
    <button class="btn btn-secondary" id="prevBtn" onclick="previousPage()" disabled>← Previous</button>
    <span id="pageInfo">Page 1</span>
    <button class="btn btn-secondary" id="nextBtn" onclick="nextPage()" disabled>Next →</button>
  </div>
</div>

<script>
  let currentOffset = 0;
  let currentLimit = 100;
  let totalRows = 0;
  let allData = [];
  let filteredData = [];
  let currentFilter = '';

  async function loadData() {
    try {
      const response = await fetch(`/api/data-log/data?limit=1000&offset=0`);
      const result = await response.json();
      
      if (result.error) {
        showError(result.error);
        return;
      }
      
      allData = result.data;
      totalRows = result.total;
      
      // Populate module filter
      const modules = [...new Set(allData.map(row => row.module_name))].sort();
      const filterSelect = document.getElementById('moduleFilter');
      filterSelect.innerHTML = '<option value="">All modules</option>';
      modules.forEach(mod => {
        const option = document.createElement('option');
        option.value = mod;
        option.textContent = mod;
        filterSelect.appendChild(option);
      });
      
      applyFilter();
    } catch (e) {
      showError('Failed to load data: ' + e);
    }
  }

  function applyFilter() {
    currentFilter = document.getElementById('moduleFilter').value;
    
    if (currentFilter === '') {
      filteredData = allData;
    } else {
      filteredData = allData.filter(row => row.module_name === currentFilter);
    }
    
    currentOffset = 0;
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('dataTable');
    const start = currentOffset;
    const end = Math.min(start + currentLimit, filteredData.length);
    const pageData = filteredData.slice(start, end);
    
    if (pageData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="loading">No data available</td></tr>';
      updateStats();
      return;
    }
    
    tbody.innerHTML = pageData.map(row => {
      const isOffline = row.module_name === 'NO_MODULES_ONLINE';
      const rowClass = isOffline ? 'offline-row' : '';
      const statusBadge = isOffline 
        ? '<span class="status-badge badge-offline">OFFLINE</span>'
        : '<span class="status-badge badge-online">ONLINE</span>';
      
      // Format timestamp
      const date = new Date(row.timestamp);
      const timeStr = date.toLocaleString();
      
      // Format debug data
      let debugDisplay = row.data;
      try {
        const parsed = JSON.parse(row.data);
        if (Array.isArray(parsed) && parsed.length > 0) {
          debugDisplay = parsed.join(', ');
        }
      } catch(e) {}
      
      return `
        <tr class="${rowClass}">
          <td class="timestamp">${timeStr}</td>
          <td class="module-name">${row.module_name} ${statusBadge}</td>
          <td>${row.module_ip || '—'}</td>
          <td>${row.version || '—'}</td>
          <td class="debug-data" title="${debugDisplay}">${debugDisplay}</td>
        </tr>
      `;
    }).join('');
    
    updateStats();
    updatePagination();
  }

  function updateStats() {
    const start = currentOffset + 1;
    const end = Math.min(currentOffset + currentLimit, filteredData.length);
    const stats = document.getElementById('stats');
    
    const filterText = currentFilter ? ` (filtered: ${currentFilter})` : '';
    stats.textContent = `Showing ${start}-${end} of ${filteredData.length} rows${filterText} | Total logged: ${totalRows}`;
  }

  function updatePagination() {
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageInfo = document.getElementById('pageInfo');
    
    prevBtn.disabled = currentOffset === 0;
    nextBtn.disabled = currentOffset + currentLimit >= filteredData.length;
    
    const currentPage = Math.floor(currentOffset / currentLimit) + 1;
    const totalPages = Math.ceil(filteredData.length / currentLimit);
    pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
  }

  function previousPage() {
    if (currentOffset > 0) {
      currentOffset = Math.max(0, currentOffset - currentLimit);
      renderTable();
    }
  }

  function nextPage() {
    if (currentOffset + currentLimit < filteredData.length) {
      currentOffset += currentLimit;
      renderTable();
    }
  }

  function changeLimit() {
    currentLimit = parseInt(document.getElementById('limitSelect').value);
    currentOffset = 0;
    renderTable();
  }

  function refreshData() {
    loadData();
  }

  function showError(msg) {
    const tbody = document.getElementById('dataTable');
    tbody.innerHTML = `<tr><td colspan="5" class="error">${msg}</td></tr>`;
  }

  // Load data on page load
  window.onload = function() {
    loadData();
    // Auto-refresh every 30 seconds
    setInterval(loadData, 30000);
  };
</script>

</body>
</html>
