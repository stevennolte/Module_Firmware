<!DOCTYPE html>
<html>
<head>
  <title>Debug – ESP32 WiFi AP</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; color: #222; padding: 20px; }
    header { background: #00695c; color: white; padding: 16px 24px; border-radius: 8px; margin-bottom: 24px; }
    header h1 { font-size: 1.4rem; color: white; }
    nav { margin-bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
    nav a { text-decoration: none; color: white; padding: 9px 18px; font-size: 0.875rem; font-weight: bold; background: #00695c; border-radius: 6px; transition: background 0.2s; }
    nav a:hover { background: #004d40; }
    .card { background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; }
    h2 { font-size: 1rem; margin: 0 0 12px 0; color: #333; }
    ul { background: #f8f9fa; border-radius: 6px; padding: 12px 12px 12px 36px; margin: 8px 0; }
    li { margin: 4px 0; font-size: 0.875rem; font-family: monospace; }
  </style>
  <script>
    function load() {
      fetch('/getDebugVars')
        .then(r => r.json())
        .then(data => {
          const ul = document.getElementById('debugList');
          ul.innerHTML = '';
          data.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item;
            ul.appendChild(li);
          });
        })
        .catch(e => console.error(e));
    }
    setInterval(load, 2000);
    window.onload = load;
  </script>
</head>
<body>
  <header><h1>ESP32 WiFi AP</h1></header>
  <nav>
    <a href="index.html">Status</a>
    <a href="debug.html">Debug</a>
    <a href="settings.html">Settings</a>
  </nav>
  <div class="card">
    <h2>Debug Variables</h2>
    <ul id="debugList"><li>Loading...</li></ul>
  </div>
</body>
</html>
