<!DOCTYPE html>
<html>
<head>
  <title>Fold Controller</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; color: #222; padding: 20px; }
    header { background: #1565c0; color: white; padding: 16px 24px; border-radius: 8px; margin-bottom: 24px; }
    header h1 { font-size: 1.4rem; color: white; }
    nav { margin-bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
    nav a { text-decoration: none; color: white; padding: 9px 18px; font-size: 0.875rem; font-weight: bold; background: #1565c0; border-radius: 6px; transition: background 0.2s; }
    nav a:hover { background: #0d47a1; }
    .card { background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; }
    h1 { font-size: 1.2rem; margin: 0 0 16px 0; color: #1565c0; }
    h2 { font-size: 1rem; margin: 0 0 12px 0; color: #333; }
    h3 { font-size: 0.95rem; margin: 8px 0; color: #333; }
    button, input[type="submit"] { padding: 9px 18px; font-size: 0.875rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; background: #1565c0; color: white; transition: background 0.2s; }
    button:hover, input[type="submit"]:hover { background: #0d47a1; }
    button:disabled { background: #90a4ae; cursor: not-allowed; }
    .stop-btn { background: #f44336; }
    .stop-btn:hover { background: #c62828; }
    .btn { padding: 9px 18px; font-size: 0.875rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    .btn-primary { background: #1565c0; color: white; }
    .btn-primary:hover { background: #0d47a1; }
    .btn-danger { background: #f44336; color: white; }
    .btn-danger:hover { background: #c62828; }
    .btn-warn { background: #ff9800; color: white; }
    .btn-warn:hover { background: #e65100; }
    .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
    .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    input[type="text"], input[type="password"], input[type="number"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    form { margin-top: 12px; }
    ul { background: #f8f9fa; border-radius: 6px; padding: 12px 12px 12px 36px; margin: 8px 0; }
    li { margin: 4px 0; font-size: 0.875rem; }
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #4CAF50; }
    input:checked + .slider:before { transform: translateX(26px); }
  </style>
  <script>
    let loggingInterval = null;
    
    function reboot() {
        fetch('/reboot')
            .then(response => response.text())
            .then(data => alert('Rebooting...'))
            .catch(error => console.error('Error:', error));
    }

    function fetchControlValue() {
      fetch('/getControlValue')
        .then(response => response.json())
        .then(data => {
          document.getElementById('controlSlider').value = data.value;
          document.getElementById('controlValue').textContent = data.value;
        })
        .catch(error => console.error("Error fetching control value:", error));
    }

    function sendControlValue(value) {
      fetch('/setControlValue', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ value: value })
      })
      .then(response => response.text())
      .then(data => console.log('Value sent successfully:', data))
      .catch(error => console.error('Error sending control value:', error));
    }

    function fetchDebugVarsForUI() {
      fetch('/getDebugVars')
        .then(response => response.json())
        .then(data => {
          let debugList = document.getElementById("debugList");
          debugList.innerHTML = "";
          data.forEach(item => {
            let li = document.createElement("li");
            li.textContent = item;
            debugList.appendChild(li);
          });
        })
        .catch(error => console.log("Error fetching debug variables:", error));
    }

    function fetchDebugVarsForLogging() {
      return fetch('/getDebugVars')
        .then(response => response.json())
        .catch(error => {
          console.log("Error fetching debug variables:", error);
          return [];
        });
    }

    function logData() {
      fetchDebugVarsForLogging().then(debugVars => {
        let data = { timestamp: new Date().toLocaleString(), debugVars: debugVars };
        let logs = JSON.parse(localStorage.getItem('logs')) || [];
        logs.push(data);
        localStorage.setItem('logs', JSON.stringify(logs));
        console.log('Data logged:', data);
      });
    }

    function startLogging() {
      if (!loggingInterval) {
        loggingInterval = setInterval(logData, 500);
        alert('Started logging data.');
      } else {
        alert('Logging is already active.');
      }
    }

    function stopLogging() {
      if (loggingInterval) {
        clearInterval(loggingInterval);
        loggingInterval = null;
        alert('Stopped logging data.');
      } else {
        alert('Logging is not active.');
      }
    }

    function updateControlValue(val) {
      document.getElementById('controlValue').textContent = val;
      sendControlValue(val);
    }

    function fetchFileList() {
      fetch('/getFiles')
        .then(response => {
          if (!response.ok) throw new Error('Network response was not ok');
          return response.json();
        })
        .then(data => {
          let fileList = document.getElementById("fileList");
          fileList.innerHTML = "";
          data.forEach(file => {
            let li = document.createElement("li");
            li.textContent = file.name;  // Assuming file has a "name" property
            fileList.appendChild(li);
          });
        })
        .catch(error => console.error("Error fetching file list:", error));
    }

    function sendToggleState(isChecked) {
      const value = isChecked ? 1 : 0;
      fetch(`/updateControl?value=${value}`, { method: 'GET' })
        .then(response => {
          if (!response.ok) throw new Error('Network response was not ok');
          return response.text();
        })
        .then(data => console.log("Toggle state updated:", data))
        .catch(error => console.error("Error updating toggle state:", error));
    }

    function fetchToggleState() {
      fetch('/getControl')
        .then(response => response.json())
        .then(data => {
          document.getElementById("controlToggle").checked = data.value === 1;
        })
        .catch(error => console.error("Error fetching toggle state:", error));
    }
    
    function toggleOn(){

    }

    window.onload = function() {
      fetchDebugVarsForUI();
      fetchFileList();
      fetchControlValue();
      fetchToggleState();
      setInterval(fetchDebugVarsForUI, 500);
    };
  </script>
</head>
<body>
  <header><h1>Fold Controller</h1></header>

  <div class="card">
    <div class="action-row">
      <button onclick="reboot()">Reboot ESP32</button>
      <button onclick="startLogging()">Start Logging</button>
      <button class="stop-btn" onclick="stopLogging()">Stop Logging</button>
    </div>
  </div>

  <div class="card">
    <h2>Debug Variables</h2>
    <ul id="debugList"></ul>
  </div>

  <div class="card">
    <h2>Files on Device</h2>
    <ul id="fileList"></ul>
  </div>

  <div class="card">
    <h2>Upload File</h2>
    <form method="POST" action="/upload" enctype="multipart/form-data">
      <input type="file" name="upload">
      <input type="submit" value="Upload">
    </form>
  </div>

  <div class="card">
    <h2>Firmware Update</h2>
    <form method="POST" action="/update" enctype="multipart/form-data">
      <input type="file" name="firmware">
      <input type="submit" value="Update Firmware">
    </form>
  </div>

  <div class="card">
    <h2>Toggle Control</h2>
    <label class="switch">
      <input type="checkbox" id="controlToggle" onchange="sendToggleState(this.checked)">
      <span class="slider"></span>
    </label>
    <div style="margin-top:16px;">
      <label style="font-size:0.875rem;">Control Variable: <span id="controlValue">50</span></label>
      <input type="range" min="0" max="100" value="50" id="controlSlider" oninput="updateControlValue(this.value)" style="width:100%; margin-top:8px;">
    </div>
  </div>
</body>
</html>
