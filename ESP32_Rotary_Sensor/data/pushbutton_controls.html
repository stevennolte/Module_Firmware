<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pushbutton Controls – Rotary Sensor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #222;
      padding: 20px;
    }
    header {
      background: #1565c0;
      color: white;
      padding: 16px 24px;
      border-radius: 8px;
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.4rem; }
    nav {
      margin-bottom: 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    nav a {
      text-decoration: none;
      color: white;
      padding: 9px 18px;
      font-size: 0.875rem;
      font-weight: bold;
      background: #1565c0;
      border-radius: 6px;
      transition: background 0.2s;
    }
    nav a:hover { background: #0d47a1; }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.2rem; margin: 0 0 16px 0; color: #1565c0; }
    h2 { font-size: 1rem; margin: 0 0 12px 0; color: #333; }
    h3 { font-size: 0.95rem; margin: 8px 0; color: #333; }
    button, input[type="submit"] {
      padding: 9px 18px;
      font-size: 0.875rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #1565c0;
      color: white;
      transition: background 0.2s;
    }
    button:hover, input[type="submit"]:hover { background: #0d47a1; }
    button:disabled { background: #90a4ae; cursor: not-allowed; }
    .stop-btn { background: #f44336; }
    .stop-btn:hover { background: #c62828; }
    .btn { padding: 9px 18px; font-size: 0.875rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    .btn-primary { background: #1565c0; color: white; }
    .btn-primary:hover { background: #0d47a1; }
    .btn-danger { background: #f44336; color: white; }
    .btn-danger:hover { background: #c62828; }
    .btn-warn { background: #ff9800; color: white; }
    .btn-warn:hover { background: #e65100; }
    .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
    .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    input[type="text"], input[type="password"], input[type="number"] {
      padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;
    }
    select {
      padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;
    }
    form { margin-top: 12px; }
    ul { background: #f8f9fa; border-radius: 6px; padding: 12px 12px 12px 36px; margin: 8px 0; }
    li { margin: 4px 0; font-size: 0.875rem; }
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc; transition: .4s; border-radius: 34px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 26px; width: 26px; left: 4px; bottom: 4px;
      background-color: white; transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #4CAF50; }
    input:checked + .slider:before { transform: translateX(26px); }
    /* Controls-specific styles */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .grid-button {
      padding: 20px;
      font-size: 0.875rem;
      font-weight: bold;
      background: #1565c0;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }
    .grid-button:hover { background: #0d47a1; }
    .grid-button:active { background: #0a3880; }
    .progress-bar {
      width: 0%;
      height: 20px;
      background-color: #1565c0;
      border-radius: 8px;
      transition: width 0.1s ease;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #ddd;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 8px;
    }
  </style>
  <script>
    let progressInterval = null; // Interval for updating the progress bar

    function sendCommand(buttonId, action) {
      const endpoint = action === 'start' ? `/button${buttonId}Pressed` : `/button${buttonId}Released`;
      fetch(endpoint, { method: 'POST' })
        .then(response => response.text())
        .then(data => {
          console.log(`Command sent: ${endpoint}, Response: ${data}`);
          if (buttonId === 1 && action === 'start') {
            startProgressBar();
          } else if (buttonId === 1 && action === 'end') {
            stopProgressBar();
          } else if (buttonId === 2 && action === 'start') {
            resetProgressBar();
          }
        })
        .catch(error => console.error(`Error sending command for button ${buttonId}:`, error));
    }

    function startProgressBar() {
      const progressBar = document.getElementById('progressBar');
      if (!progressInterval) {
        progressInterval = setInterval(() => {
          let currentWidth = parseInt(progressBar.style.width) || 0;
          if (currentWidth < 100) {
            progressBar.style.width = (currentWidth + 1) + '%'; // Increment progress by 1%
          } else {
            clearInterval(progressInterval);
            progressInterval = null;
          }
        }, 100); // Update every 100ms
      }
    }

    function stopProgressBar() {
      if (progressInterval) {
        clearInterval(progressInterval);
        progressInterval = null;
      }
    }

    function resetProgressBar() {
      const progressBar = document.getElementById('progressBar');
      progressBar.style.width = '0%'; // Reset progress to 0%
      stopProgressBar(); // Ensure the progress bar stops
    }
  </script>
</head>
<body>
  <header><h1>Pushbutton Controls – Rotary Sensor</h1></header>

  <nav>
    <a href="index.html">Main</a>
    <a href="settings.html">Settings</a>
  </nav>

  <div class="card">
    <h1>Controls</h1>
    <p>Control your ESP32 device here using the buttons below:</p>

    <div class="grid-container">
      <!-- Generate 2x7 grid of buttons -->
      <script>
        for (let row = 1; row <= 7; row++) { // 7 rows
          for (let col = 1; col <= 2; col++) { // 2 columns
            const buttonId = (row - 1) * 2 + col; // Calculate button ID (1 to 14)
            document.write(`
              <button
                class="grid-button"
                ontouchstart="sendCommand(${buttonId}, 'start')"
                onmousedown="sendCommand(${buttonId}, 'start')"
                ontouchend="sendCommand(${buttonId}, 'end')"
                onmouseup="sendCommand(${buttonId}, 'end')"
              >
                Button ${buttonId}
              </button>
            `);
          }
        }
      </script>
    </div>
  </div>

  <div class="card">
    <h2>Progress for Button 1</h2>
    <div class="progress-bar-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
  </div>
</body>
</html>
