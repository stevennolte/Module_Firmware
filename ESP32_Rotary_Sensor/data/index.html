<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32 Rotary Sensor – Web Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #222;
      padding: 20px;
    }
    header {
      background: #1565c0;
      color: white;
      padding: 16px 24px;
      border-radius: 8px;
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.4rem; }
    nav {
      margin-bottom: 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    nav a {
      text-decoration: none;
      color: white;
      padding: 9px 18px;
      font-size: 0.875rem;
      font-weight: bold;
      background: #1565c0;
      border-radius: 6px;
      transition: background 0.2s;
    }
    nav a:hover { background: #0d47a1; }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.2rem; margin: 0 0 16px 0; color: #1565c0; }
    h2 { font-size: 1rem; margin: 0 0 12px 0; color: #333; }
    h3 { font-size: 0.95rem; margin: 8px 0; color: #333; }
    button, input[type="submit"] {
      padding: 9px 18px;
      font-size: 0.875rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #1565c0;
      color: white;
      transition: background 0.2s;
    }
    button:hover, input[type="submit"]:hover { background: #0d47a1; }
    button:disabled { background: #90a4ae; cursor: not-allowed; }
    .stop-btn { background: #f44336; }
    .stop-btn:hover { background: #c62828; }
    .btn { padding: 9px 18px; font-size: 0.875rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    .btn-primary { background: #1565c0; color: white; }
    .btn-primary:hover { background: #0d47a1; }
    .btn-danger { background: #f44336; color: white; }
    .btn-danger:hover { background: #c62828; }
    .btn-warn { background: #ff9800; color: white; }
    .btn-warn:hover { background: #e65100; }
    .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
    .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    input[type="text"], input[type="password"], input[type="number"] {
      padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;
    }
    select {
      padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;
    }
    form { margin-top: 12px; }
    ul { background: #f8f9fa; border-radius: 6px; padding: 12px 12px 12px 36px; margin: 8px 0; }
    li { margin: 4px 0; font-size: 0.875rem; }
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc; transition: .4s; border-radius: 34px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 26px; width: 26px; left: 4px; bottom: 4px;
      background-color: white; transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #4CAF50; }
    input:checked + .slider:before { transform: translateX(26px); }
    .button_test { background: none; border: none; cursor: pointer; }
    .button svg { width: 50px; height: 50px; }
  </style>
  <script>
    let debugData = []; // Store the latest fetched debug variables
    let debugLog = [];  // Store the entire log of debug variables

    function reboot() {
      fetch('/reboot')
        .then(() => alert('Rebooting...'))
        .catch(error => console.error('Error:', error));
    }

    function startLogging() {
      alert('Started logging data.');
    }

    function stopLogging() {
      alert('Stopped logging data.');
    }

    // Function to fetch and update the debug variables
    function fetchDebugVars() {
      fetch('/getDebugVars') // Replace with your ESP32 endpoint for debug variables
        .then(response => {
          if (!response.ok) {
            throw new Error('Failed to fetch debug variables');
          }
          return response.json();
        })
        .then(data => {
          debugData = data; // Store the latest fetched data
          debugLog.push({ timestamp: new Date().toISOString(), data }); // Append to the log with a timestamp
          console.log('Fetched debug variables:', data); // Log the debug variables to the console

          // Update the debug list in the UI
          const debugList = document.getElementById('debugList');
          debugList.innerHTML = ''; // Clear the current list
          data.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item;
            debugList.appendChild(li);
          });
        })
        .catch(error => console.error('Error fetching debug variables:', error));
    }


    function zeroSensor() {
      fetch('/zeroSensor')
        .then(() => alert('Sensor zeroed.'))
        .catch(error => console.error('Error:', error));
    }

    function resetZero() {
      fetch('/resetZero')
        .then(() => alert('Zero reset.'))
        .catch(error => console.error('Error:', error));
    }
    // Function to download the entire debug log as a file
    function downloadDebugLog() {
      if (debugLog.length === 0) {
        alert('No debug log available to download.');
        return;
      }

      const blob = new Blob([JSON.stringify(debugLog, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'debug_log.json'; // File name
      a.click();
      URL.revokeObjectURL(url); // Clean up the URL object
    }

    // Periodically fetch debug variables every 1 second
    setInterval(fetchDebugVars, 500);

    // Fetch debug variables immediately when the page loads
    window.onload = function() {
      fetchDebugVars();
      fetchFwModuleName();
    };

    // Firmware update: fetch module name for filename validation
    function fetchFwModuleName() {
      fetch('/getDebugVars')
        .then(r => r.json())
        .then(data => {
          for (const item of data) {
            if (item.startsWith('Program: ')) {
              const name = item.replace('Program: ', '').trim();
              const hint = document.getElementById('fwModuleHint');
              if (hint) hint.textContent = 'Expected file: ' + name + '.bin';
              const inp = document.getElementById('fwFile');
              if (inp) inp.dataset.moduleName = name;
              break;
            }
          }
        })
        .catch(() => {});
    }

    function uploadFirmware() {
      const fileInput = document.getElementById('fwFile');
      const statusEl = document.getElementById('fwStatus');
      if (!fileInput.files.length) {
        statusEl.textContent = 'Please select a firmware file.';
        statusEl.style.color = 'red';
        return;
      }
      const file = fileInput.files[0];
      const moduleName = fileInput.dataset.moduleName || '';
      if (moduleName && !file.name.startsWith(moduleName)) {
        statusEl.textContent = 'Wrong file! Expected a file starting with: ' + moduleName;
        statusEl.style.color = 'red';
        return;
      }
      const formData = new FormData();
      formData.append('firmware', file);
      statusEl.textContent = 'Uploading...';
      statusEl.style.color = '#333';
      fetch('/update', { method: 'POST', body: formData })
        .then(r => r.text())
        .then(msg => {
          statusEl.textContent = msg;
          statusEl.style.color = msg.includes('complete') || msg.includes('Rebooting') ? 'green' : 'red';
        })
        .catch(err => {
          statusEl.textContent = 'Upload error: ' + err;
          statusEl.style.color = 'red';
        });
    }
  </script>
</head>
<body>
  <header><h1>ESP32 Rotary Sensor</h1></header>

  <nav>
    <a href="controls.html">Controls</a>
    <a href="settings.html">Settings</a>
  </nav>

  <div class="card">
    <h1>Actions</h1>
    <div class="action-row">
      <button onclick="reboot()">Reboot ESP32</button>
      <button onclick="startLogging()">Start Logging</button>
      <button class="stop-btn" onclick="stopLogging()">Stop Logging</button>
      <button_test onclick="alert('Button clicked!')">
        <img src="vector-settings-icon.jpg" width="50" height="50" alt="SVG Button" />
      </button_test>
    </div>
  </div>

  <div class="card">
    <h1>ESP32 Debug Variables</h1>
    <ul id="debugList">
      <!-- Debug variables will be dynamically added here -->
    </ul>
    <div class="action-row" style="margin-top: 12px;">
      <button onclick="downloadDebugLog()">Download Debug Log</button>
      <button onclick="zeroSensor()">Zero Sensor</button>
      <button onclick="resetZero()">Reset Zero</button>
    </div>
  </div>

  <div class="card">
    <h1>Files on Device</h1>
    <ul id="fileList">
      <!-- File list will be dynamically added here -->
    </ul>
    <h2>Upload File</h2>
    <form method="POST" action="/upload" enctype="multipart/form-data">
      <div class="action-row" style="margin-top: 8px;">
        <input type="file" name="upload">
        <input type="submit" value="Upload">
      </div>
    </form>
  </div>

  <div class="card">
    <h1>Firmware Update</h1>
    <p id="fwModuleHint" style="color:#666; font-size:0.875rem; margin-bottom: 10px;">Expected file: loading...</p>
    <div class="action-row">
      <input type="file" id="fwFile" accept=".bin">
      <button onclick="uploadFirmware()">Update Firmware</button>
    </div>
    <p id="fwStatus" style="margin-top:8px;"></p>
  </div>

</body>
</html>
