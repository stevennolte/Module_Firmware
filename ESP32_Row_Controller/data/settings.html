<!DOCTYPE html>
<html>
<head>
  <title>Settings – ESP32 Row Controller</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; color: #222; padding: 20px; }
    header { background: #1565c0; color: white; padding: 16px 24px; border-radius: 8px; margin-bottom: 24px; }
    header h1 { font-size: 1.4rem; color: white; }
    nav { margin-bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
    nav a { text-decoration: none; color: white; padding: 9px 18px; font-size: 0.875rem; font-weight: bold; background: #1565c0; border-radius: 6px; transition: background 0.2s; }
    nav a:hover { background: #0d47a1; }
    .card { background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; }
    h1 { font-size: 1.2rem; margin: 0 0 16px 0; color: #1565c0; }
    h2 { font-size: 1rem; margin: 0 0 12px 0; color: #333; }
    h3 { font-size: 0.95rem; margin: 8px 0; color: #333; }
    button, input[type="submit"] { padding: 9px 18px; font-size: 0.875rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; background: #1565c0; color: white; transition: background 0.2s; }
    button:hover, input[type="submit"]:hover { background: #0d47a1; }
    button:disabled { background: #90a4ae; cursor: not-allowed; }
    .stop-btn { background: #f44336; }
    .stop-btn:hover { background: #c62828; }
    .btn { padding: 9px 18px; font-size: 0.875rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    .btn-primary { background: #1565c0; color: white; }
    .btn-primary:hover { background: #0d47a1; }
    .btn-danger { background: #f44336; color: white; }
    .btn-danger:hover { background: #c62828; }
    .btn-warn { background: #ff9800; color: white; }
    .btn-warn:hover { background: #e65100; }
    .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
    .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    input[type="text"], input[type="password"], input[type="number"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    form { margin-top: 12px; }
    ul { background: #f8f9fa; border-radius: 6px; padding: 12px 12px 12px 36px; margin: 8px 0; }
    li { margin: 4px 0; font-size: 0.875rem; }
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #4CAF50; }
    input:checked + .slider:before { transform: translateX(26px); }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.875rem; }
    input[type="text"], input[type="password"] { width: 100%; margin-top: 4px; }
    .card { max-width: 520px; }
    #statusMsg { margin-top: 10px; color: #333; font-size: 0.875rem; }
  </style>
  <script>
    function saveSettings() {
      const ssid = document.getElementById('ssid').value;
      const password = document.getElementById('password').value;
      const ip3 = document.getElementById('ip3').value;
      const formData = new URLSearchParams();
      formData.append('ssid', ssid);
      formData.append('password', password);
      formData.append('ip3', ip3);
      fetch('/saveSettings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
      })
        .then(r => r.text())
        .then(msg => {
          document.getElementById('statusMsg').textContent = msg;
        })
        .catch(e => console.error(e));
    }

    // Firmware update: fetch module name for filename validation
    function fetchFwModuleName() {
      fetch('/getDebugVars')
        .then(r => r.json())
        .then(data => {
          for (const item of data) {
            if (item.startsWith('Program: ')) {
              const name = item.replace('Program: ', '').trim();
              const hint = document.getElementById('fwModuleHint');
              if (hint) hint.textContent = 'Expected file: ' + name + '.bin';
              const inp = document.getElementById('fwFile');
              if (inp) inp.dataset.moduleName = name;
              break;
            }
          }
        })
        .catch(() => {});
    }

    function uploadFirmware() {
      const fileInput = document.getElementById('fwFile');
      const statusEl = document.getElementById('fwStatus');
      if (!fileInput.files.length) {
        statusEl.textContent = 'Please select a firmware file.';
        statusEl.style.color = 'red';
        return;
      }
      const file = fileInput.files[0];
      const moduleName = fileInput.dataset.moduleName || '';
      if (moduleName && !file.name.startsWith(moduleName)) {
        statusEl.textContent = 'Wrong file! Expected a file starting with: ' + moduleName;
        statusEl.style.color = 'red';
        return;
      }
      const formData = new FormData();
      formData.append('firmware', file);
      statusEl.textContent = 'Uploading...';
      statusEl.style.color = '#333';
      fetch('/update', { method: 'POST', body: formData })
        .then(r => r.text())
        .then(msg => {
          statusEl.textContent = msg;
          statusEl.style.color = msg.includes('complete') || msg.includes('Rebooting') ? 'green' : 'red';
        })
        .catch(err => {
          statusEl.textContent = 'Upload error: ' + err;
          statusEl.style.color = 'red';
        });
    }

    window.onload = fetchFwModuleName;
  </script>
</head>
<body>
  <header><h1>Settings – Row Controller</h1></header>
  <nav>
    <a href="index.html">Sections</a>
    <a href="debug.html">Debug</a>
    <a href="settings.html">Settings</a>
  </nav>

  <div class="card">
    <h2>Network</h2>
    <p style="font-size:0.875rem; color:#555; margin-bottom:8px;">
      Changes take effect after reboot.<br>
      Default AP SSID: <strong>ESP32_Row_Controller</strong><br>
      Default AP Password: <strong>1234567890</strong>
    </p>
    <label>WiFi SSID</label>
    <input type="text" id="ssid" placeholder="Your network SSID">
    <label>WiFi Password</label>
    <input type="password" id="password" placeholder="Your network password">
    <label>Device IP (last octet, e.g. 5 &rarr; 192.168.1.5)</label>
    <input type="text" id="ip3" placeholder="5">
    <button style="margin-top:14px;" onclick="saveSettings()">Save &amp; Reboot</button>
    <p id="statusMsg"></p>
  </div>

  <div class="card">
    <h2>Firmware OTA Update</h2>
    <p id="fwModuleHint" style="color:#666; font-size:0.875rem; margin-bottom:10px;">Expected file: loading...</p>
    <div class="action-row">
      <input type="file" id="fwFile" accept=".bin">
      <button onclick="uploadFirmware()">Upload Firmware</button>
    </div>
    <p id="fwStatus" style="margin-top:8px;"></p>
  </div>
</body>
</html>
