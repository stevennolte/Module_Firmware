<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug – Fold Controller</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #222;
      padding: 20px;
    }
    header {
      background: #1565c0;
      color: white;
      padding: 16px 24px;
      border-radius: 8px;
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.4rem; }
    nav {
      margin-bottom: 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    nav a {
      text-decoration: none;
      color: white;
      padding: 9px 18px;
      font-size: 0.875rem;
      font-weight: bold;
      background: #1565c0;
      border-radius: 6px;
      transition: background 0.2s;
    }
    nav a:hover { background: #0d47a1; }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.2rem; margin: 0 0 16px 0; color: #1565c0; }
    h2 { font-size: 1rem; margin: 0 0 12px 0; color: #333; }
    h3 { font-size: 0.95rem; margin: 8px 0; color: #333; }
    button, input[type="submit"] {
      padding: 9px 18px;
      font-size: 0.875rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #1565c0;
      color: white;
      transition: background 0.2s;
    }
    button:hover, input[type="submit"]:hover { background: #0d47a1; }
    button:disabled { background: #90a4ae; cursor: not-allowed; }
    .stop-btn { background: #f44336; }
    .stop-btn:hover { background: #c62828; }
    .btn { padding: 9px 18px; font-size: 0.875rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    .btn-primary { background: #1565c0; color: white; }
    .btn-primary:hover { background: #0d47a1; }
    .btn-danger { background: #f44336; color: white; }
    .btn-danger:hover { background: #c62828; }
    .btn-warn { background: #ff9800; color: white; }
    .btn-warn:hover { background: #e65100; }
    .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
    .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    input[type="text"], input[type="password"], input[type="number"] {
      padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;
    }
    select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    form { margin-top: 12px; }
    ul { background: #f8f9fa; border-radius: 6px; padding: 12px 12px 12px 36px; margin: 8px 0; }
    li { margin: 4px 0; font-size: 0.875rem; }
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc; transition: .4s; border-radius: 34px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 26px; width: 26px; left: 4px; bottom: 4px;
      background-color: white; transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #4CAF50; }
    input:checked + .slider:before { transform: translateX(26px); }
  </style>
  <script>
    let loggingInterval = null;  // Variable to store the logging interval ID

    // Function to reboot the ESP32
    function reboot() {
        fetch('/reboot')
            .then(response => response.text())
            .then(data => {
                alert('Rebooting...');
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }
    
    // Function to fetch the current control variable from the ESP32
    function fetchControlValue() {
      fetch('/getControlValue')
        .then(response => response.json())
        .then(data => {
          document.getElementById('controlSlider').value = data.value; // Set slider to the fetched value
          document.getElementById('controlValue').textContent = data.value; // Display fetched value
        })
        .catch(error => console.error("Error fetching control value:", error));
    }

    function toggleAPMode() {
            fetch('/toggleAPMode', { method: 'POST' })
                .then(response => response.text())
                .then(data => {
                    document.getElementById('toggleStatus').innerText = data;
                })
                .catch(error => console.error('Error:', error));
      }

    // Function to send the updated control value to the ESP32
    function sendControlValue(value) {
      fetch('/setControlValue', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ value: value })
      })
      .then(response => response.text())
      .then(data => {
        console.log('Value sent successfully:', data);
      })
      .catch(error => console.error('Error sending control value:', error));
    }

    // Function to fetch debug variables for UI updates
    function fetchDebugVarsForUI() {
      fetch('/getDebugVars')
        .then(response => response.json())
        .then(data => {
          let debugList = document.getElementById("debugList");
          debugList.innerHTML = "";  // Clear current list
          data.forEach((item) => {
            let li = document.createElement("li");
            li.textContent = item;
            debugList.appendChild(li);
          });
        })
        .catch(error => console.log("Error fetching debug variables:", error));
    }

    // Function to fetch debug variables for logging
    function fetchDebugVarsForLogging() {
      return fetch('/getDebugVars')
        .then(response => response.json())
        .catch(error => {
          console.log("Error fetching debug variables:", error);
          return [];
        });
    }

    // Function to log data locally
    function logData() {
      fetchDebugVarsForLogging().then(debugVars => {
        let data = {
          timestamp: new Date().toLocaleString(),
          debugVars: debugVars
        };

        // Log to local storage
        let logs = JSON.parse(localStorage.getItem('logs')) || [];
        logs.push(data);
        localStorage.setItem('logs', JSON.stringify(logs));

        console.log('Data logged:', data);
      });
    }

    // Function to start logging data continuously
    function startLogging() {
      if (!loggingInterval) {  // Ensure only one interval is set
        loggingInterval = setInterval(logData, 500);  // Log every 2 seconds
        alert('Started logging data.');
      } else {
        alert('Logging is already active.');
      }
    }

    // Function to stop logging data
    function stopLogging() {
      if (loggingInterval) {
        clearInterval(loggingInterval);
        loggingInterval = null;
        alert('Stopped logging data.');
      } else {
        alert('Logging is not active.');
      }
    }

    // Function to update the control value displayed and send the new value to ESP32
    function updateControlValue(val) {
      document.getElementById('controlValue').textContent = val;
      sendControlValue(val);  // Send the updated value to the ESP32
    }

    // Auto-refresh the debug variables in the UI
    // setInterval(fetchDebugVarsForUI, 500);  // Refresh the debug list every 500ms

    // Fetch the control variable when the page loads
    window.onload = function() {
      fetchControlValue();
    }
    // Function to fetch file list from the ESP32
    function fetchFileList() {
  fetch('/getFiles')
    .then(response => {
      if (!response.ok) {
        throw new Error('Network response was not ok');
      }
      return response.json();
    })
    .then(data => {
      console.log("Files received:", data);  // Log the received data to check its structure
      let fileList = document.getElementById("fileList");
      fileList.innerHTML = "";  // Clear current list
      data.forEach((file) => {
        let li = document.createElement("li");
        li.textContent = JSON.stringify(file);  // Temporarily log the full object
        fileList.appendChild(li);
      });
    })
    .catch(error => console.error("Error fetching file list:", error));
  }
    // Fetch the file list when the page loads
    window.onload = function() {
      fetchDebugVarsForUI();  // Load debug vars on page load
      fetchFileList();        // Load file list on page load
    }
    // Auto-refresh the debug variables in the UI
    setInterval(fetchDebugVarsForUI, 500); 
    
    // Refresh the debug list every 500ms
  
  function sendToggleState(isChecked) {
    const value = isChecked ? 1 : 0;  // Convert to 1 for ON, 0 for OFF
    fetch(`/updateControl?value=${value}`, { method: 'GET' })
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.text();  // Assuming ESP32 returns some text response
      })
      .then(data => {
        console.log("Toggle state updated:", data);  // Log the response
      })
      .catch(error => console.error("Error updating toggle state:", error));
  }

  // Function to fetch the current toggle state from the ESP32
  function fetchToggleState() {
    fetch('/getControl')
      .then(response => response.json())
      .then(data => {
        document.getElementById("controlToggle").checked = data.value === 1;
      })
      .catch(error => console.error("Error fetching toggle state:", error));
  }
  function buttonPressed() {
            console.log("Button is being pressed");
            fetch('/buttonPressed', { method: 'POST' })
                .then(response => response.text())
                .then(data => {
                    console.log("Button press command sent:", data);
                })
                .catch(error => console.error("Error sending button press command:", error));
        }

    function buttonReleased() {
        console.log("Button released");
        fetch('/buttonReleased', { method: 'POST' })
                .then(response => response.text())
                .then(data => {
                    console.log("Button release command sent:", data);
                })
                .catch(error => console.error("Error sending button release command:", error));
    }

  // Fetch the toggle state when the page loads
  window.onload = function() {
    fetchToggleState();  // Load the current state on page load
    fetchFwModuleName(); // Load module name for firmware validation
  };

  // Firmware update: fetch module name for filename validation
  function fetchFwModuleName() {
    fetch('/getDebugVars')
      .then(r => r.json())
      .then(data => {
        for (const item of data) {
          if (item.startsWith('Program: ')) {
            const name = item.replace('Program: ', '').trim();
            const hint = document.getElementById('fwModuleHint');
            if (hint) hint.textContent = 'Expected file: ' + name + '.bin';
            const inp = document.getElementById('fwFile');
            if (inp) inp.dataset.moduleName = name;
            break;
          }
        }
      })
      .catch(() => {});
  }

  function uploadFirmware() {
    const fileInput = document.getElementById('fwFile');
    const statusEl = document.getElementById('fwStatus');
    if (!fileInput.files.length) {
      statusEl.textContent = 'Please select a firmware file.';
      statusEl.style.color = 'red';
      return;
    }
    const file = fileInput.files[0];
    const moduleName = fileInput.dataset.moduleName || '';
    if (moduleName && !file.name.startsWith(moduleName)) {
      statusEl.textContent = 'Wrong file! Expected a file starting with: ' + moduleName;
      statusEl.style.color = 'red';
      return;
    }
    const formData = new FormData();
    formData.append('firmware', file);
    statusEl.textContent = 'Uploading...';
    statusEl.style.color = '#333';
    fetch('/update', { method: 'POST', body: formData })
      .then(r => r.text())
      .then(msg => {
        statusEl.textContent = msg;
        statusEl.style.color = msg.includes('complete') || msg.includes('Rebooting') ? 'green' : 'red';
      })
      .catch(err => {
        statusEl.textContent = 'Upload error: ' + err;
        statusEl.style.color = 'red';
      });
  }
  </script>
</head>
<body>
  <header><h1>Debug – Fold Controller</h1></header>

  <nav>
    <a href="boom.html">Boom Control</a>
    <a href="debug.html">Debug</a>
    <a href="settings.html">Settings</a>
  </nav>

  <div class="card">
    <div class="action-row">
      <button onclick="reboot()">Reboot ESP32</button>
      <button onclick="startLogging()">Start Logging</button>
      <button class="stop-btn" onclick="stopLogging()">Stop Logging</button>
    </div>
    <div class="action-row">
      <button onclick="toggleAPMode()">Toggle AP Mode</button>
    </div>
    <p id="toggleStatus">Status: Unknown</p>
  </div>

  <div class="card">
    <h1>Debug Variables</h1>
    <ul id="debugList"></ul>
  </div>

  <div class="card">
    <h1>Files on Device</h1>
    <ul id="fileList"></ul>
    <h2>Upload File</h2>
    <form method="POST" action="/upload" enctype="multipart/form-data">
      <input type="file" name="upload">
      <input type="submit" value="Upload">
    </form>
  </div>

  <div class="card">
    <h2>Firmware Update</h2>
    <p id="fwModuleHint" style="color:#666; font-size:0.875rem; margin-bottom:8px;">Expected file: loading...</p>
    <div class="action-row">
      <input type="file" id="fwFile" accept=".bin">
      <button onclick="uploadFirmware()">Update Firmware</button>
    </div>
    <p id="fwStatus" style="margin-top:8px;"></p>
  </div>

</body>
</html>
