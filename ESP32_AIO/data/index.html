<!DOCTYPE html>
<html lang="en">
<head>
  <title>ESP32_AIO – Web Manager</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #222;
      padding: 20px;
    }
    header {
      background: #1565c0;
      color: white;
      padding: 16px 24px;
      border-radius: 8px;
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.4rem; }
    nav {
      margin-bottom: 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    nav a {
      text-decoration: none;
      color: white;
      padding: 9px 18px;
      font-size: 0.875rem;
      font-weight: bold;
      background: #1565c0;
      border-radius: 6px;
      transition: background 0.2s;
    }
    nav a:hover { background: #0d47a1; }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.2rem; margin: 0 0 16px 0; color: #1565c0; }
    h2 { font-size: 1rem; margin: 0 0 12px 0; color: #333; }
    h3 { font-size: 0.95rem; margin: 8px 0; color: #333; }
    button, input[type="submit"] {
      padding: 9px 18px;
      font-size: 0.875rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #1565c0;
      color: white;
      transition: background 0.2s;
    }
    button:hover, input[type="submit"]:hover { background: #0d47a1; }
    button:disabled { background: #90a4ae; cursor: not-allowed; }
    .stop-btn { background: #f44336; }
    .stop-btn:hover { background: #c62828; }
    .btn { padding: 9px 18px; font-size: 0.875rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    .btn-primary { background: #1565c0; color: white; }
    .btn-primary:hover { background: #0d47a1; }
    .btn-danger { background: #f44336; color: white; }
    .btn-danger:hover { background: #c62828; }
    .btn-warn { background: #ff9800; color: white; }
    .btn-warn:hover { background: #e65100; }
    .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
    .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    input[type="text"], input[type="password"], input[type="number"] {
      padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;
    }
    select {
      padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;
    }
    form { margin-top: 12px; }
    ul { background: #f8f9fa; border-radius: 6px; padding: 12px 12px 12px 36px; margin: 8px 0; }
    li { margin: 4px 0; font-size: 0.875rem; }
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc; transition: .4s; border-radius: 34px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 26px; width: 26px; left: 4px; bottom: 4px;
      background-color: white; transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #4CAF50; }
    input:checked + .slider:before { transform: translateX(26px); }
  </style>
  <script>
  const fetchWithTimeout = (url, options = {}, timeout = 5000) => {
    const controller = new AbortController();
    const signal = controller.signal;
    const fetchPromise = fetch(url, { ...options, signal });

    const timeoutId = setTimeout(() => controller.abort(), timeout);

    return fetchPromise.finally(() => clearTimeout(timeoutId));
  };

    function reboot() {
      fetchWithTimeout('/reboot', {}, 5000)
        .then(() => alert('Rebooting...'))
        .catch(error => console.error('Error:', error));
    }

    function downloadStartupLog() {
      window.location.href = '/download?filename=startup.log';
    }

    function isConnected() {
      const statusImage = document.getElementById("connectionStatusImage");
      const timeout = setTimeout(() => {
        statusImage.src = "/Module_Disconnected";
      }, 2000);

      fetchWithTimeout('/Module_Connected', {}, 5000)
        .then(response => {
          clearTimeout(timeout);
          statusImage.src = response.ok ? "/Module_Connected" : "/Module_Disconnected";
        })
        .catch(() => {
          clearTimeout(timeout);
          statusImage.src = "/Module_Disconnected";
        });
    }

    function getFileList() {
      fetchWithTimeout('/getFiles', {}, 5000)
        .then(response => response.json())
        .then(data => {
          const fileList = document.getElementById('fileList');
          fileList.innerHTML = '';
          data.forEach(file => {
            const option = document.createElement('option');
            option.value = file.name;
            option.text = file.name;
            fileList.appendChild(option);
          });
        })
        .catch(error => console.error('Error fetching file list:', error));
    }

    function downloadFile() {
      const fileList = document.getElementById('fileList');
      const selectedFile = fileList.value;
      if (selectedFile) {
        window.location.href = `/download?filename=${selectedFile}`;
      } else {
        alert('Please select a file to download.');
      }
    }

    function fetchControlValue() {
      fetchWithTimeout('/getControlValue', {}, 5000)
        .then(response => response.json())
        .then(data => {
          document.getElementById('controlSlider').value = data.value;
          document.getElementById('controlValue').textContent = data.value;
        })
        .catch(error => console.error("Error fetching control value:", error));
    }

    function zeroWAS() {
      fetchWithTimeout('/zeroWAS', {}, 5000)
        .then(() => console.info('Zeroing WAS...'))
        .catch(error => console.error('Error:', error));
    }

    function toggleAPMode() {
      fetchWithTimeout('/toggleAPMode', { method: 'POST' }, 5000)
        .then(response => response.text())
        .then(data => {
          document.getElementById('toggleStatus').innerText = data;
        })
        .catch(error => console.error('Error:', error));
    }

    function sendControlValue(value) {
      fetchWithTimeout('/setControlValue', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ value })
      }, 5000)
        .then(response => response.text())
        .then(data => console.log('Value sent successfully:', data))
        .catch(error => console.error('Error sending control value:', error));
    }

    function fetchDebugVarsForUI() {
      fetchWithTimeout('/getDebugVars', {}, 5000)
        .then(response => response.json())
        .then(data => {
          const debugList = document.getElementById("debugList");
          debugList.innerHTML = "";
          data.forEach(item => {
            const li = document.createElement("li");
            li.textContent = item;
            debugList.appendChild(li);
          });
        })
        .catch(error => console.log("Error fetching debug variables:", error));
    }

    function logData() {
      fetchWithTimeout('/getDebugVars', {}, 5000)
        .then(response => response.json())
        .then(debugVars => {
          const logs = JSON.parse(localStorage.getItem('logs')) || [];
          logs.push({ timestamp: new Date().toLocaleString(), debugVars });
          localStorage.setItem('logs', JSON.stringify(logs));
          console.log('Data logged:', debugVars);
        })
        .catch(error => console.log("Error fetching debug variables:", error));
    }

    function startLogging() {
      if (!loggingInterval) {
        loggingInterval = setInterval(logData, 100);
        alert('Started logging data.');
      } else {
        alert('Logging is already active.');
      }
    }

    function stopLogging() {
      if (loggingInterval) {
        clearInterval(loggingInterval);
        loggingInterval = null;
        alert('Stopped logging data.');
      } else {
        alert('Logging is not active.');
      }
    }

    let debugInterval = 500; // Default interval
    let debugIntervalId = null;

    function updateDebugInterval() {
      const intervalInput = document.getElementById('debugInterval').value;
      const newInterval = parseInt(intervalInput, 10);

      if (isNaN(newInterval) || newInterval < 100) {
        alert('Please enter a valid interval (minimum 100ms).');
        return;
      }

      debugInterval = newInterval;

      // Clear the existing interval and set a new one
      if (debugIntervalId) {
        clearInterval(debugIntervalId);
      }
      debugIntervalId = setInterval(fetchDebugVarsForUI, debugInterval);

      alert(`Debug fetch interval updated to ${debugInterval}ms.`);
    }

    function toggleDebugMode() {
      const isFullDebug = document.getElementById('fullDebugToggle').checked;
      fetchWithTimeout('/setDebugMode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullDebug: isFullDebug })
      })
        .then(response => response.text())
        .then(data => {
          console.log('Debug mode changed:', data);
          // Immediately refresh debug variables with new mode
          fetchDebugVarsForUI();
        })
        .catch(error => console.error('Error setting debug mode:', error));
    }

    window.onload = function() {
      fetchControlValue();
      // fetchDebugVarsForUI();
      // getFileList();
      debugIntervalId = setInterval(fetchDebugVarsForUI, debugInterval); // Use the default interval
      // setInterval(isConnected, 1000);
      fetchFwModuleName();
    };

    function setGpsSource() {
      const source = document.getElementById('gpsSource').value;
      fetchWithTimeout('/setGpsSource', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ source })
      }, 5000)
        .then(response => response.text())
        .then(data => alert('GPS source set: ' + data))
        .catch(error => alert('Error setting GPS source: ' + error));
    }

    // Firmware update: fetch module name for filename validation
    function fetchFwModuleName() {
      fetch('/getDebugVars')
        .then(r => r.json())
        .then(data => {
          for (const item of data) {
            if (item.startsWith('Program: ')) {
              const name = item.replace('Program: ', '').trim();
              const hint = document.getElementById('fwModuleHint');
              if (hint) hint.textContent = 'Expected file: ' + name + '.bin';
              const inp = document.getElementById('fwFile');
              if (inp) inp.dataset.moduleName = name;
              break;
            }
          }
        })
        .catch(() => {});
    }

    function uploadFirmware() {
      const fileInput = document.getElementById('fwFile');
      const statusEl = document.getElementById('fwStatus');
      if (!fileInput.files.length) {
        statusEl.textContent = 'Please select a firmware file.';
        statusEl.style.color = 'red';
        return;
      }
      const file = fileInput.files[0];
      const moduleName = fileInput.dataset.moduleName || '';
      if (moduleName && !file.name.startsWith(moduleName)) {
        statusEl.textContent = 'Wrong file! Expected a file starting with: ' + moduleName;
        statusEl.style.color = 'red';
        return;
      }
      const formData = new FormData();
      formData.append('firmware', file);
      statusEl.textContent = 'Uploading...';
      statusEl.style.color = '#333';
      fetch('/update', { method: 'POST', body: formData })
        .then(r => r.text())
        .then(msg => {
          statusEl.textContent = msg;
          statusEl.style.color = msg.includes('complete') || msg.includes('Rebooting') ? 'green' : 'red';
        })
        .catch(err => {
          statusEl.textContent = 'Upload error: ' + err;
          statusEl.style.color = 'red';
        });
    }
  </script>
</head>
<body>
  <header><h1>ESP32_AIO</h1></header>

  <nav>
    <a href="/settings">⚙️ Settings</a>
    <a href="/serialmonitor">📡 Serial Monitor</a>
  </nav>

  <div class="card">
    <h1>Actions</h1>
    <div class="action-row">
      <button onclick="reboot()">Reboot ESP32</button>
      <button onclick="startLogging()">Start Logging</button>
      <button class="stop-btn" onclick="stopLogging()">Stop Logging</button>
      <button onclick="downloadStartupLog()">📋 Download Startup Log</button>
    </div>
  </div>

  <div class="card">
    <h1>Debug Variables</h1>
    <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
      <label class="switch">
        <input type="checkbox" id="fullDebugToggle" onchange="toggleDebugMode()">
        <span class="slider round"></span>
      </label>
      <span>Full Debug Variables</span>
    </div>
    <ul id="debugList"></ul>
    <div style="margin-top: 16px; display: flex; align-items: center; gap: 8px;">
      <h2>Fetch Interval</h2>
      <label for="debugInterval">Interval (ms):</label>
      <input type="number" id="debugInterval" value="500" min="100" step="100">
      <button onclick="updateDebugInterval()">Set Interval</button>
    </div>
  </div>

  <div class="card">
    <h1>File Manager</h1>
    <div class="action-row">
      <button onclick="getFileList()">Get File List</button>
      <select id="fileList"></select>
      <button onclick="downloadFile()">Download Selected File</button>
    </div>
    <h2>Upload File</h2>
    <form method="POST" action="/upload" enctype="multipart/form-data">
      <div class="action-row" style="margin-top: 8px;">
        <input type="file" name="upload">
        <input type="submit" value="Upload">
      </div>
    </form>
  </div>

  <div class="card">
    <h1>Firmware Update</h1>
    <p id="fwModuleHint" style="color:#666; font-size:0.875rem; margin-bottom: 10px;">Expected file: loading...</p>
    <div class="action-row">
      <input type="file" id="fwFile" accept=".bin">
      <button onclick="uploadFirmware()">Update Firmware</button>
    </div>
    <p id="fwStatus" style="margin-top:8px;"></p>
  </div>

  <div class="card">
    <h1>ESP32 Control</h1>
    <div class="action-row">
      <button onclick="zeroWAS()">Zero WAS</button>
    </div>
    <h2>GPS Source</h2>
    <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px;">
      <label for="gpsSource">Select GPS Source:</label>
      <select id="gpsSource" onchange="setGpsSource()">
        <option value="um982">UM982 GPS</option>
        <option value="external">External GPS</option>
      </select>
    </div>
  </div>
</body>
</html>
