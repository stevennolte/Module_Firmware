<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boom Control – Product Controller</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #222;
      padding: 20px;
    }
    header {
      background: #1565c0;
      color: white;
      padding: 16px 24px;
      border-radius: 8px;
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.4rem; }
    nav {
      margin-bottom: 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    nav a {
      text-decoration: none;
      color: white;
      padding: 9px 18px;
      font-size: 0.875rem;
      font-weight: bold;
      background: #1565c0;
      border-radius: 6px;
      transition: background 0.2s;
    }
    nav a:hover { background: #0d47a1; }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.2rem; margin: 0 0 16px 0; color: #1565c0; }
    h2 { font-size: 1rem; margin: 0 0 12px 0; color: #333; }
    h3 { font-size: 0.95rem; margin: 8px 0; color: #333; }
    button, input[type="submit"] {
      padding: 9px 18px;
      font-size: 0.875rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #1565c0;
      color: white;
      transition: background 0.2s;
    }
    button:hover, input[type="submit"]:hover { background: #0d47a1; }
    button:disabled { background: #90a4ae; cursor: not-allowed; }
    .stop-btn { background: #f44336; }
    .stop-btn:hover { background: #c62828; }
    .btn { padding: 9px 18px; font-size: 0.875rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    .btn-primary { background: #1565c0; color: white; }
    .btn-primary:hover { background: #0d47a1; }
    .btn-danger { background: #f44336; color: white; }
    .btn-danger:hover { background: #c62828; }
    .btn-warn { background: #ff9800; color: white; }
    .btn-warn:hover { background: #e65100; }
    .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
    .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    input[type="text"], input[type="password"], input[type="number"] {
      padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;
    }
    select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    form { margin-top: 12px; }
    ul { background: #f8f9fa; border-radius: 6px; padding: 12px 12px 12px 36px; margin: 8px 0; }
    li { margin: 4px 0; font-size: 0.875rem; }
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc; transition: .4s; border-radius: 34px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 26px; width: 26px; left: 4px; bottom: 4px;
      background-color: white; transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #4CAF50; }
    input:checked + .slider:before { transform: translateX(26px); }
    .switch-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .switch-label {
      font-size: 0.95rem;
      font-weight: bold;
      color: #333;
    }
    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }
    .button-grid button {
      font-size: 0.9rem;
      background: #1565c0;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .button-grid button:hover { background: #0d47a1; }
    .button-grid button:active { background: #0a3880; }
  </style>
</head>
<body>
  <header><h1>Boom Control – Product Controller</h1></header>

  <nav>
    <a href="boom.html">Boom Control</a>
    <a href="product.html">Product Control</a>
    <a href="debug.html">Debug</a>
    <a href="settings.html">Settings</a>
  </nav>

  <div class="card">
    <h1>Fold Controls</h1>
    <div class="switch-container">
      <label class="switch">
        <input type="checkbox" id="foldOuterWings" onchange="handleToggleChange('foldOuterWings', this.checked)">
        <span class="slider"></span>
      </label>
      <span class="switch-label">Fold Outer Wings</span>
    </div>
    <div class="switch-container">
      <label class="switch">
        <input type="checkbox" id="foldCenterWings" onchange="handleToggleChange('foldCenterWings', this.checked)">
        <span class="slider"></span>
      </label>
      <span class="switch-label">Fold Center Wings</span>
    </div>
    <div class="switch-container">
      <label class="switch">
        <input type="checkbox" id="raiseWings" onchange="handleToggleChange('raiseWings', this.checked)">
        <span class="slider"></span>
      </label>
      <span class="switch-label">Raise Wings</span>
    </div>
  </div>

  <div class="card">
    <h1>Momentary Controls</h1>
    <div class="button-grid">
      <button onmousedown="handleButtonPress(event, 'leftFlipOut')" onmouseup="handleButtonRelease('leftFlipOut')"
              ontouchstart="handleButtonPress(event, 'leftFlipOut')" ontouchend="handleButtonRelease('leftFlipOut')">
        Left Flip Out
      </button>
      <button onmousedown="startSendingCommand('leftFlipIn')" onmouseup="stopSendingCommand('leftFlipIn')"
              ontouchstart="startSendingCommand('leftFlipIn')" ontouchend="stopSendingCommand('leftFlipIn')">
        Left Flip In
      </button>
      <button onmousedown="startSendingCommand('leftLiftUp')" onmouseup="stopSendingCommand('leftLiftUp')"
              ontouchstart="startSendingCommand('leftLiftUp')" ontouchend="stopSendingCommand('leftLiftUp')">
        Left Lift
      </button>
      <button onmousedown="startSendingCommand('leftLowerUp')" onmouseup="stopSendingCommand('leftLowerUp')"
              ontouchstart="startSendingCommand('leftLowerUp')" ontouchend="stopSendingCommand('leftLowerUp')">
        Left Lower
      </button>
      <button onmousedown="startSendingCommand('leftFoldIn')" onmouseup="stopSendingCommand('leftFoldIn')"
              ontouchstart="startSendingCommand('leftFoldIn')" ontouchend="stopSendingCommand('leftFoldIn')">
        Left Fold Out
      </button>
      <button onmousedown="startSendingCommand('leftFoldOut')" onmouseup="stopSendingCommand('leftFoldOut')"
              ontouchstart="startSendingCommand('leftFoldOut')" ontouchend="stopSendingCommand('leftFoldOut')">
        Left Fold In
      </button>
      <button onmousedown="startSendingCommand('centerUp')" onmouseup="stopSendingCommand('centerUp')"
              ontouchstart="startSendingCommand('centerUp')" ontouchend="stopSendingCommand('centerUp')">
        Center Raise
      </button>
      <button onmousedown="startSendingCommand('centerDown')" onmouseup="stopSendingCommand('centerDown')"
              ontouchstart="startSendingCommand('centerDown')" ontouchend="stopSendingCommand('centerDown')">
        Center Lower
      </button>
      <button onmousedown="startSendingCommand('RightFoldIn')" onmouseup="stopSendingCommand('RightFoldIn')"
              ontouchstart="startSendingCommand('RightFoldIn')" ontouchend="stopSendingCommand('RightFoldIn')">
        Right Fold Out
      </button>
      <button onmousedown="startSendingCommand('RightFoldOut')" onmouseup="stopSendingCommand('RightFoldOut')"
              ontouchstart="startSendingCommand('RightFoldOut')" ontouchend="stopSendingCommand('RightFoldOut')">
        Right Fold In
      </button>
      <button onmousedown="startSendingCommand('RightLiftUp')" onmouseup="stopSendingCommand('RightLiftUp')"
              ontouchstart="startSendingCommand('RightLiftUp')" ontouchend="stopSendingCommand('RightLiftUp')">
        Right Lift
      </button>
      <button onmousedown="startSendingCommand('RightLiftDown')" onmouseup="stopSendingCommand('RightLiftDown')"
              ontouchstart="startSendingCommand('RightLiftDown')" ontouchend="stopSendingCommand('RightLiftDown')">
        Right Lower
      </button>
      <button onmousedown="startSendingCommand('RightFlipOut')" onmouseup="stopSendingCommand('RightFlipOut')"
              ontouchstart="startSendingCommand('RightFlipOut')" ontouchend="stopSendingCommand('RightFlipOut')">
        Right Flip Out
      </button>
      <button onmousedown="startSendingCommand('RightFlipIn')" onmouseup="stopSendingCommand('RightFlipIn')"
              ontouchstart="startSendingCommand('RightFlipIn')" ontouchend="stopSendingCommand('RightFlipIn')">
        Right Flip In
      </button>
    </div>
  </div>

  <script>
        // Command Functions
        function sendCommand(command, state) {
            const action = state ? 'on' : 'off';
            console.log(`Sending command: ${command} - ${action}`);
            fetch(`/${command}/${action}`, { method: 'POST' })
                .then(response => response.text())
                .then(data => console.log(`Response from controller: ${data}`))
                .catch(error => console.error(`Error sending command for ${command}:`, error));
        }

        function sendMomentaryCommand(button, action) {
            console.log(`Sending momentary command: ${button} - ${action}`);
            fetch(`/momentary?button=${button}&action=${action}`, { method: 'POST' })
                .then(response => response.text())
                .then(data => console.log(`Response from controller: ${data}`))
                .catch(error => console.error(`Error sending momentary command for ${button}:`, error));
        }

        // Repeated Command Functions
        let intervalId = null;
        function startSendingCommand(button) {
            sendMomentaryCommand(button, 'start');
            intervalId = setInterval(() => sendMomentaryCommand(button, 'start'), 500);
        }
        function stopSendingCommand(button) {
            clearInterval(intervalId);
            intervalId = null;
            sendMomentaryCommand(button, 'stop');
        }

        let toggleIntervals = {};
        function startToggleCommand(command) {
            sendCommand(command, true);
            toggleIntervals[command] = setInterval(() => sendCommand(command, true), 500);
        }
        function stopToggleCommand(command) {
            clearInterval(toggleIntervals[command]);
            delete toggleIntervals[command];
            sendCommand(command, false);
        }

        // Event Handlers
        function handleToggleChange(command, isChecked) {
            isChecked ? startToggleCommand(command) : stopToggleCommand(command);
        }

        function handleButtonPress(event, buttonId) {
            startSendingCommand(buttonId);
        }
        function handleButtonRelease(buttonId) {
            stopSendingCommand(buttonId);
        }
    </script>
</body>
</html>
