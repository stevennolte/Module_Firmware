; PlatformIO Project Configuration File
;
; ESP32_GPS – GPS / NTRIP / IMU module for ESP32-S3 devkitc-1 N8R8
; WiFi access point: NOLTE_FARM
;
; Functions mirrored from ESP32_AIO:
;   - UM980 GNSS receiver (GPS) via UART1
;   - BNO08x IMU via UART2
;   - NTRIP corrections forwarded from UDP port 2233 to GPS UART
;   - PANDA sentence generation and UDP broadcast on port 9999
;   - AgIO hello response on UDP port 8888
;
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
extra_scripts = build_post_script.py
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    ESP32Async/ESPAsyncWebServer @ 3.6.0
    adafruit/Adafruit BNO08x
    sparkfun/SparkFun UM980 Triband RTK GNSS Arduino Library@^2.0.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
